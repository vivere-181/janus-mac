name: Build

on:
  push:
  pull_request:

jobs:
  mac:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build the app
        run: |
          cd ui
          swift build -c release --product Android
      - name: Test the protocol pieces
        run: |
          cd ui
          swift test --filter JanusLinkTests
